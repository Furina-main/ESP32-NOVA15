<div class="appearance-panel" x-data="appearanceApp()" x-cloak>
  <h4>色彩预设 (无背景图时生效)</h4>
  <div class="theme-list" style="margin-bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap;">
    <div class="theme-item" style="background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); color: #333; padding: 8px 12px; border-radius: 6px; cursor: pointer;" @click="setTheme('blue-pink')">海盐蓝粉</div>
    <div class="theme-item" style="background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #333; padding: 8px 12px; border-radius: 6px; cursor: pointer;" @click="setTheme('sunset')">日落黄昏</div>
    <div class="theme-item" style="background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%); color: #333; padding: 8px 12px; border-radius: 6px; cursor: pointer;" @click="setTheme('green')">薄荷清柠</div>
    <div class="theme-item" style="background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); color: #333; padding: 8px 12px; border-radius: 6px; cursor: pointer;" @click="setTheme('purple')">梦幻紫蓝</div>
    <div class="theme-item" style="background: linear-gradient(135deg, #232526 0%, #414345 100%); color: #fff; padding: 8px 12px; border-radius: 6px; cursor: pointer;" @click="setTheme('dark')">深邃暗夜</div>
  </div>

  <hr style="border: none; border-top: 1px solid rgba(0,0,0,0.1); margin: 16px 0;">

  <h4>自定义网页背景 (全自动匹配)</h4>
  <div style="font-size:12px; color:#888; margin-bottom: 12px;">
    💡 系统会自动识别屏幕。如果是电脑，会自动找 bg_pc.jpg；如果是手机，会自动找 bg_mobile.jpg。
    上传的 JPG 会自动压缩到 <strong style="color:#ff3b30;">105KB</strong> 以内。
  </div>

  <!-- 端选择：切换后立即同步路径 -->
  <div style="display: flex; gap: 20px; margin-bottom: 12px; font-size: 14px; flex-wrap: wrap;">
    <label style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
      <input type="radio" name="bgType" value="pc" x-model="bgType" @change="onBgTypeChange()"> 电脑端图 (16:9)
    </label>
    <label style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
      <input type="radio" name="bgType" value="mobile" x-model="bgType" @change="onBgTypeChange()"> 手机端图 (9:16)
    </label>
  </div>

  <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap;">
    <label style="cursor: pointer; padding: 10px 16px; background: #fff; border: 1px dashed #007aff; color: #007aff; border-radius: 6px; font-weight: bold; display: inline-flex; align-items: center; gap: 8px;">
      📁 选择本地图片上传
      <input type="file" accept="image/jpeg,image/png,image/webp" style="display: none;" @change="uploadImg($event)">
    </label>

    <button class="btn-danger" @click="clearBg()" style="margin: 0; padding: 10px 16px; border-radius: 6px; border: none; background: #ff3b30; color: #fff; font-weight: bold; cursor: pointer;">🗑️ 删除当前端背景</button>
  </div>

  <div style="margin-bottom: 16px; background: rgba(0,0,0,0.03); padding: 10px; border-radius: 8px;">
    <div style="font-size: 14px; margin-bottom: 8px;">
      <span>当前 <span x-text="bgType === 'pc' ? '电脑' : '手机'"></span> 端背景路径：</span>
      <strong style="color: #34c759; word-break: break-all;" x-text="currentBgPath || '（未设置，系统自动探测）'"></strong>
    </div>
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      <select x-model="selectedImg" class="setting-row input" style="flex: 1; min-width: 180px; padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
        <option value="">-- 或者从图库手动选择一张图片 --</option>
        <template x-for="img in availableImgs" :key="img">
          <option :value="img" x-text="img"></option>
        </template>
      </select>
      <button class="btn-success" @click="applySelectedBg()" :disabled="!selectedImg" style="padding: 6px 12px; border-radius: 4px; border: none; background: #34c759; color: #fff; font-weight: bold; cursor: pointer;">应用该图</button>
    </div>
  </div>

  <!-- 🎯 裁剪弹窗：去掉外层 !important 的 display: flex，防止 x-show 失效 -->
  <div x-show="showCropModal" x-cloak
       style="position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; background: rgba(0,0,0,0.85) !important; z-index: 999999 !important; padding: 8px; box-sizing: border-box;">
    
    <div style="display: flex; width: 100%; height: 100%; align-items: center; justify-content: center;">
      <div style="background:#fff; padding:16px; border-radius:12px; width:100%; max-width:420px; max-height:92vh; overflow-y:auto; box-sizing:border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <h3 style="margin:0 0 6px; font-size:16px; text-align:center;">拖拽调整背景位置</h3>
        <div style="font-size:12px; color:#888; text-align:center; margin-bottom:10px;"
             x-text="'为【' + (uploadTargetType === 'pc' ? '电脑端 16:9' : '手机端 9:16') + '】裁剪：拖动平移，双指/滑块缩放'"></div>

        <!-- 裁剪框：宽高由 JS 按视口计算，鼠标/触摸都适配 -->
        <div style="display:flex; justify-content:center; margin-bottom:12px;">
          <div style="position:relative; background:#222; overflow:hidden; border-radius:8px; touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab;"
               :style="getCropViewportStyle()"
               @mousedown="startDrag($event)"
               @touchstart="startTouch($event)"
               @touchmove.prevent="onTouch($event)"
               @touchend="endTouch($event)"
               @touchcancel="endTouch($event)">
            <canvas x-ref="cropCanvas" style="position:absolute; left:0; top:0; width:100%; height:100%; display:block;"></canvas>
          </div>
        </div>

        <div style="margin-bottom:12px; text-align:center;">
          <label style="font-size:13px; color:#666;">缩放：</label>
          <input type="range" :value="cropScale" @input="onScaleInput($event)" min="1" max="5" step="0.01" style="width:70%; vertical-align:middle;">
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <span style="font-size:12px; color:#888; flex:1; min-width:0; word-break:break-all;" x-text="uploadStatus"></span>
          <div style="display:flex; gap:8px; flex-shrink:0;">
            <button @click="closeCropModal()" :disabled="isUploading" style="padding:8px 14px; border-radius:6px; border:none; background:#ccc; color:#333; font-weight:bold; cursor:pointer;">取消</button>
            <button @click="doUploadBg()" :disabled="isUploading" style="padding:8px 14px; border-radius:6px; border:none; background:#007aff; color:#fff; font-weight:bold; cursor:pointer;">
              <span x-text="isUploading ? '上传中...' : '确认上传'"></span>
            </button>
          </div>
        </div>

        <!-- 进度条 -->
        <div x-show="isUploading" style="width:100%; height:6px; background:#eee; border-radius:3px; margin-top:12px; overflow:hidden;">
          <div :style="'width:' + uploadPercent + '%; height:100%; background:#34c759; transition:width 0.2s;'"></div>
        </div>

        <div style="font-size:11px; color:#aaa; text-align:center; margin-top:8px;">
          导出格式 JPG，自动压缩至 ≤ 105KB
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function appearanceApp() {
    return {
        // 上传大小硬限制
        MAX_BG_BYTES: 105 * 1024,

        availableImgs: [],
        selectedImg: '',
        bgType: (window.innerWidth < 768 || ('ontouchstart' in window)) ? 'mobile' : 'pc',
        currentBgPath: '',
        _uiCfg: null,

        showCropModal: false,
        isUploading: false,
        uploadPercent: 0,
        uploadStatus: '',
        uploadTargetType: 'pc',   // 打开弹窗时锁定目标端，防止中途变化
        cropImage: null,
        cropScale: 1,
        cropOffsetX: 0,
        cropOffsetY: 0,
        cropDisplayW: 0,
        cropDisplayH: 0,

        _isDragging: false,
        _lastX: 0,
        _lastY: 0,
        _onWinMove: null,
        _onWinUp: null,
        _touchMode: null,
        _dragStartCX: 0,
        _dragStartCY: 0,
        _dragStartOffX: 0,
        _dragStartOffY: 0,
        _pinchStartDist: 0,
        _pinchStartScale: 1,
        _onResize: null,

        async init() {
            this._onResize = () => {
                if (this.showCropModal) this.computeCropDisplaySize();
            };
            window.addEventListener('resize', this._onResize);
            await this.loadData();
        },

        destroy() {
            if (this._onResize) window.removeEventListener('resize', this._onResize);
            this.endDrag();
            document.body.style.overflow = '';
        },

        setTheme(t) {
            localStorage.setItem('ui_theme', t);
            if (window.applyAppearance) window.applyAppearance();
        },

        _norm(p) {
            return p ? String(p).replace(/^\/+/, '') : '';
        },

        async loadData() {
            // 1) 加载图库
            try {
                var r = await fetch('/api/files/refresh', { method: 'POST' });
                var j = await r.json();
                var files = j.files || {};
                var allImgs = [];
                ['/ext', '/res', '/img'].forEach(function (dir) {
                    if (files[dir]) {
                        files[dir].forEach(function (f) {
                            if (f.name && f.name.match(/\.(jpg|jpeg|png|webp)$/i)) {
                                allImgs.push(dir.substring(1) + '/' + f.name);
                            }
                        });
                    }
                });
                this.availableImgs = allImgs;
            } catch (e) {
                console.error('获取图库失败', e);
                this.availableImgs = [];
            }

            // 2) 缓存 UI 配置（切换端时不再重复请求）
            try {
                var r2 = await fetch('/api/all');
                var j2 = await r2.json();
                this._uiCfg = (j2.config || {}).ui || {};
            } catch (e) {
                this._uiCfg = {};
            }

            this.refreshCurrentPath();
        },

        /** 根据当前 bgType 从缓存配置中同步路径与下拉选中项 */
        refreshCurrentPath() {
            var ui = this._uiCfg || {};
            if (this.bgType === 'pc') {
                this.currentBgPath = ui.bg_path_pc || 'ext/bg_pc.jpg';
            } else {
                this.currentBgPath = ui.bg_path_mobile || 'ext/bg_mobile.jpg';
            }
            var norm = this._norm(this.currentBgPath);
            var idx = this.availableImgs.map((p) => this._norm(p)).indexOf(norm);
            this.selectedImg = idx >= 0 ? this.availableImgs[idx] : '';
        },

        onBgTypeChange() {
            if (this.showCropModal) return;
            this.refreshCurrentPath();
        },

        async applySelectedBg() {
            if (!this.selectedImg) return;
            try {
                var r = await fetch('/api/config/ui_bg', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: this.selectedImg, type: this.bgType })
                });
                var j = await r.json();
                if (j.ok) {
                    this.currentBgPath = this.selectedImg;
                    alert('背景已更新！页面即将刷新。');
                    window.location.reload();
                } else {
                    alert('设置失败: ' + (j.err || '未知错误'));
                }
            } catch (e) {
                alert('请求失败');
            }
        },

        async clearBg() {
            if (!confirm('确定要清除当前端背景吗？')) return;
            try {
                await fetch('/api/config/ui_bg?type=' + this.bgType, { method: 'DELETE' });
                this.currentBgPath = '';
                alert('背景已清除，页面即将刷新。');
                window.location.reload();
            } catch (e) {
                alert('请求失败');
            }
        },

        /* ============ 上传与裁剪 ============ */

        uploadImg(e) {
            var file = e.target.files && e.target.files[0];
            if (e.target) e.target.value = ''; // 允许重复选择同一文件
            if (!file) return;
            if (!file.type || file.type.indexOf('image/') !== 0) {
                alert('请选择图片文件');
                return;
            }

            // 锁定上传目标端
            var targetType = this.bgType;

            var reader = new FileReader();
            reader.onload = (ev) => {
                var img = new Image();
                img.onload = () => {
                    this.uploadTargetType = targetType;
                    this.cropImage = img;
                    this.cropScale = 1;
                    this.cropOffsetX = 0;
                    this.cropOffsetY = 0;
                    this.uploadPercent = 0;
                    this.uploadStatus = '准备就绪';
                    this.computeCropDisplaySize();
                    this.showCropModal = true;
                    document.body.style.overflow = 'hidden';
                    this.$nextTick(() => {
                        this.initCropCanvas();
                    });
                };
                img.onerror = () => { alert('图片加载失败，请换一张'); };
                img.src = ev.target.result;
            };
            reader.onerror = () => { alert('读取文件失败'); };
            reader.readAsDataURL(file);
        },

        /** 按视口计算裁剪框的显示尺寸，保证手机/电脑都不溢出 */
        computeCropDisplaySize() {
            var isPC = this.uploadTargetType === 'pc';
            var ratio = isPC ? 16 / 9 : 9 / 16;

            var availW = Math.min(window.innerWidth * 0.92, 420) - 40;
            var availH = window.innerHeight * 0.9 - 260;
            if (availW < 120) availW = Math.max(80, window.innerWidth - 48);
            if (availH < 100) availH = 100;

            var maxW = isPC ? 380 : 260;
            var w = Math.min(availW, maxW, availH * ratio);
            if (w < 90) w = 90;

            this.cropDisplayW = Math.round(w);
            this.cropDisplayH = Math.round(w / ratio);
        },

        getCropViewportStyle() {
            var w = this.cropDisplayW || 300;
            var h = this.cropDisplayH || (this.uploadTargetType === 'pc' ? 169 : 533);
            return 'width:' + w + 'px; height:' + h + 'px; max-width:100%;';
        },

        initCropCanvas() {
            var cvs = this.$refs.cropCanvas;
            if (!cvs) return;
            var isPC = this.uploadTargetType === 'pc';
            // 固定逻辑分辨率，避免大图撑爆内存
            cvs.width = isPC ? 800 : 450;
            cvs.height = isPC ? 450 : 800;
            this.drawCrop();
        },

        drawCrop() {
            var cvs = this.$refs.cropCanvas;
            if (!cvs || !this.cropImage) return;
            var ctx = cvs.getContext('2d');
            var W = cvs.width, H = cvs.height;

            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, W, H);

            // cover 方式铺满，缩放 ≥ 1 保证不露黑边
            var baseScale = Math.max(W / this.cropImage.width, H / this.cropImage.height);
            var finalScale = baseScale * this.cropScale;
            var dispW = this.cropImage.width * finalScale;
            var dispH = this.cropImage.height * finalScale;

            // 限制平移范围，避免把图片拖出画面
            var maxOffX = Math.max(0, (dispW - W) / 2);
            var maxOffY = Math.max(0, (dispH - H) / 2);
            if (this.cropOffsetX > maxOffX) this.cropOffsetX = maxOffX;
            if (this.cropOffsetX < -maxOffX) this.cropOffsetX = -maxOffX;
            if (this.cropOffsetY > maxOffY) this.cropOffsetY = maxOffY;
            if (this.cropOffsetY < -maxOffY) this.cropOffsetY = -maxOffY;

            ctx.save();
            ctx.translate(W / 2 + this.cropOffsetX, H / 2 + this.cropOffsetY);
            ctx.scale(finalScale, finalScale);
            ctx.drawImage(this.cropImage, -this.cropImage.width / 2, -this.cropImage.height / 2);
            ctx.restore();
        },

        onScaleInput(e) {
            var v = parseFloat(e.target.value);
            if (isNaN(v)) return;
            if (v < 1) v = 1;
            if (v > 5) v = 5;
            this.cropScale = v;
            this.drawCrop();
        },

        /* ---------- 鼠标拖动（window 级监听，移出裁剪框也不丢） ---------- */

        startDrag(e) {
            if (this.isUploading || !this.cropImage) return;
            if (e.button !== undefined && e.button !== 0) return;
            this._isDragging = true;
            this._lastX = e.clientX;
            this._lastY = e.clientY;
            this._onWinMove = (ev) => this.onDrag(ev);
            this._onWinUp = () => this.endDrag();
            window.addEventListener('mousemove', this._onWinMove);
            window.addEventListener('mouseup', this._onWinUp);
            if (e.preventDefault) e.preventDefault();
        },

        onDrag(e) {
            if (!this._isDragging) return;
            var cvs = this.$refs.cropCanvas;
            if (!cvs) return;
            var rect = cvs.getBoundingClientRect();
            if (!rect.width || !rect.height) return;

            var dx = e.clientX - this._lastX;
            var dy = e.clientY - this._lastY;
            this.cropOffsetX += dx * (cvs.width / rect.width);
            this.cropOffsetY += dy * (cvs.height / rect.height);
            this._lastX = e.clientX;
            this._lastY = e.clientY;
            this.drawCrop();
        },

        endDrag() {
            this._isDragging = false;
            if (this._onWinMove) {
                window.removeEventListener('mousemove', this._onWinMove);
                this._onWinMove = null;
            }
            if (this._onWinUp) {
                window.removeEventListener('mouseup', this._onWinUp);
                this._onWinUp = null;
            }
        },

        /* ---------- 触摸：单指拖动 / 双指缩放，松开一指自动切回拖动 ---------- */

        startTouch(e) {
            if (this.isUploading || !this.cropImage) return;
            if (e.touches.length === 1) {
                this._touchMode = 'drag';
                this._dragStartCX = e.touches[0].clientX;
                this._dragStartCY = e.touches[0].clientY;
                this._dragStartOffX = this.cropOffsetX;
                this._dragStartOffY = this.cropOffsetY;
            } else if (e.touches.length >= 2) {
                this._touchMode = 'pinch';
                var dx = e.touches[1].clientX - e.touches[0].clientX;
                var dy = e.touches[1].clientY - e.touches[0].clientY;
                this._pinchStartDist = Math.sqrt(dx * dx + dy * dy) || 1;
                this._pinchStartScale = this.cropScale;
            }
        },

        onTouch(e) {
            if (this.isUploading) return;
            var cvs = this.$refs.cropCanvas;
            if (!cvs) return;
            var rect = cvs.getBoundingClientRect();
            if (!rect.width || !rect.height) return;

            if (this._touchMode === 'drag' && e.touches.length === 1) {
                var dx = e.touches[0].clientX - this._dragStartCX;
                var dy = e.touches[0].clientY - this._dragStartCY;
                this.cropOffsetX = this._dragStartOffX + dx * (cvs.width / rect.width);
                this.cropOffsetY = this._dragStartOffY + dy * (cvs.height / rect.height);
                this.drawCrop();
            } else if (this._touchMode === 'pinch' && e.touches.length >= 2) {
                var dx2 = e.touches[1].clientX - e.touches[0].clientX;
                var dy2 = e.touches[1].clientY - e.touches[0].clientY;
                var dist = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 1;
                var ns = this._pinchStartScale * (dist / this._pinchStartDist);
                if (ns < 1) ns = 1;
                if (ns > 5) ns = 5;
                this.cropScale = ns;
                this.drawCrop();
            } else if (this._touchMode === 'pinch' && e.touches.length === 1) {
                // 双指变单指：切回拖动，重置基准
                this._touchMode = 'drag';
                this._dragStartCX = e.touches[0].clientX;
                this._dragStartCY = e.touches[0].clientY;
                this._dragStartOffX = this.cropOffsetX;
                this._dragStartOffY = this.cropOffsetY;
            }
        },

        endTouch(e) {
            if (!e.touches || e.touches.length === 0) {
                this._touchMode = null;
            } else if (e.touches.length === 1) {
                this._touchMode = 'drag';
                this._dragStartCX = e.touches[0].clientX;
                this._dragStartCY = e.touches[0].clientY;
                this._dragStartOffX = this.cropOffsetX;
                this._dragStartOffY = this.cropOffsetY;
            }
        },

        closeCropModal() {
            if (this.isUploading) return;
            this.endDrag();
            this._touchMode = null;
            this.showCropModal = false;
            document.body.style.overflow = '';
        },

        /* ---------- 压缩到 105KB 以内 ---------- */

        compressToLimit(canvas, maxBytes, onProgress) {
            return new Promise((resolve, reject) => {
                var qualities = [0.85, 0.8, 0.75, 0.7, 0.65, 0.6, 0.5, 0.4];
                var qi = 0;
                var shrinkRound = 0;
                var MAX_SHRINK_ROUNDS = 6;
                var curCanvas = canvas;

                function tryCurrent() {
                    if (qi >= qualities.length) {
                        if (shrinkRound >= MAX_SHRINK_ROUNDS) {
                            resolve(null);
                            return;
                        }
                        shrinkRound++;
                        var nw = Math.max(1, Math.floor(curCanvas.width * 0.8));
                        var nh = Math.max(1, Math.floor(curCanvas.height * 0.8));
                        var nc = document.createElement('canvas');
                        nc.width = nw;
                        nc.height = nh;
                        var nctx = nc.getContext('2d');
                        nctx.imageSmoothingEnabled = true;
                        nctx.imageSmoothingQuality = 'high';
                        nctx.drawImage(curCanvas, 0, 0, nw, nh);
                        curCanvas = nc;
                        qi = 0;
                        if (onProgress) onProgress('已缩小到 ' + nw + '×' + nh + '，继续压缩...');
                    }
                    curCanvas.toBlob(function (blob) {
                        if (!blob) { reject(new Error('图片导出失败')); return; }
                        if (blob.size <= maxBytes) {
                            resolve({ blob: blob, w: curCanvas.width, h: curCanvas.height });
                        } else {
                            qi++;
                            tryCurrent();
                        }
                    }, 'image/jpeg', qualities[qi]);
                }

                tryCurrent();
            });
        },

        /* ---------- 上传 ---------- */

        async doUploadBg() {
            if (this.isUploading || !this.cropImage) return;
            this.isUploading = true;
            this.uploadPercent = 0;
            this.uploadStatus = '正在压缩图片 (限制 105KB)...';

            try {
                var cvs = this.$refs.cropCanvas;
                
                var result = await this.compressToLimit(cvs, this.MAX_BG_BYTES, (msg) => {
                    this.uploadStatus = msg;
                });
                if (!result) {
                    throw new Error('压缩后仍超过 105KB，请换一张内容更简单的图片');
                }
                var blob = result.blob;

                var compressedKB = (blob.size / 1024).toFixed(1);
                this.uploadStatus = '已压缩至 ' + compressedKB + 'KB，准备上传...';

                var type = this.uploadTargetType;
                var baseName = type === 'pc' ? 'bg_pc.jpg' : 'bg_mobile.jpg';
                var path = 'ext/' + baseName;
                var size = blob.size;

                var res = await fetch('/api/upload/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: path, size: size })
                });
                if (!res.ok) throw new Error('初始化失败 HTTP ' + res.status);
                var j = await res.json();
                if (!j.ok) throw new Error(j.err || '初始化失败');

                var targetPath = j.path;
                var chunkSize = 8192;
                var offset = 0;

                while (offset < size) {
                    var chunk = blob.slice(offset, offset + chunkSize);
                    var cr = await fetch('/api/upload/chunk', { method: 'POST', body: chunk });
                    if (!cr.ok) throw new Error('传输中断 HTTP ' + cr.status);

                    offset += chunkSize;
                    var sent = Math.min(offset, size);
                    var percent = Math.floor((sent / size) * 100);
                    this.uploadPercent = percent > 100 ? 100 : percent;
                    this.uploadStatus = '上传中 ' + (sent / 1024).toFixed(1) + 'KB / ' + (size / 1024).toFixed(1) + 'KB';
                }

                this.uploadStatus = '正在应用...';
                await fetch('/api/upload/end', { method: 'POST' });

                await fetch('/api/config/ui_bg', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: targetPath, type: type })
                });

                this.uploadStatus = '✅ 成功！即将刷新...';
                this.uploadPercent = 100;
                document.body.style.overflow = '';
                setTimeout(() => { window.location.reload(); }, 700);

            } catch (err) {
                alert('上传失败: ' + err.message);
                this.uploadStatus = '❌ 失败: ' + err.message;
                this.isUploading = false;
            }
        }
    };
}
</script>
