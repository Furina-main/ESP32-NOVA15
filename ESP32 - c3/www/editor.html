<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线编辑器</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,sans-serif;padding:12px;background:#f0f2f5;margin:0}
h2{margin:4px 0 8px 0}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
button{padding:6px 12px;font-size:13px;border:none;border-radius:5px;background:#0070c0;color:#fff;cursor:pointer}
button:hover{background:#005a9e}
button.g{background:#43a047}
button.r{background:#c62828}
button.gray{background:#888}
button:disabled{opacity:0.5;cursor:not-allowed}
.state{font-size:12px;padding:6px 10px;border-radius:5px;background:#f5f5f5;margin:6px 0}
.state.ok{color:#2e7d32;background:#e8f5e9}
.state.no{color:#c62828;background:#ffebee}
.tree{font-size:13px;max-height:200px;overflow:auto;background:#fff;padding:8px;border-radius:6px;border:1px solid #ddd;margin:6px 0}
.tree b{display:block;margin:6px 0 2px 0;color:#333}
.tree button{font-size:12px;padding:3px 8px;margin:2px;background:#e3f2fd;color:#0070c0}
.tree button.py{background:#ffebee;color:#c62828}
.tree button.ext{background:#e8f5e9;color:#2e7d32}
textarea{width:100%;height:420px;font-family:monospace;font-size:13px;padding:8px;border:1px solid #ccc;border-radius:6px;line-height:1.4}
.path{font-size:13px;font-weight:bold;color:#333}
.msg{font-size:13px;min-height:20px;margin:6px 0}
.hint{font-size:12px;color:#888;margin:6px 0}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:99;align-items:center;justify-content:center}
.modal.on{display:flex}
.modal .box{background:#fff;padding:20px;border-radius:8px;max-width:340px;width:90%}
.modal h3{margin:0 0 10px 0}
.modal input,.modal select{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:14px;box-sizing:border-box;margin-bottom:8px}
</style>
</head>
<body>
<h2>📝 在线编辑器</h2>
<div class="bar">
  <button onclick="window.close()">❌ 关闭</button>
  <button onclick="loadList()">🔄 刷新列表</button>
  <button onclick="showNew()" class="g">➕ 新建文本</button>
  <button id="btnSave" class="g" style="display:none" onclick="save()">💾 保存</button>
  <button id="btnReboot" class="r" style="display:none" onclick="doReboot()">🔄 重启板子</button>
  <button id="btnSetPwd" class="g" style="display:none" onclick="showPwdSetup()">🔑 首次设置密码</button>
  <button id="btnLogout" class="gray" style="display:none" onclick="logout()">🚪 退出登录</button>
</div>
<div id="state" class="state">加载中...</div>
<div class="hint">💡 .py 文件保存后会写回滚标志，重启验证失败自动恢复</div>
<div id="tree" class="tree">加载中...</div>
<div id="editorBox" style="display:none">
  <div class="path" id="currentPath"></div>
  <textarea id="editor" spellcheck="false"></textarea>
  <div id="msg" class="msg"></div>
</div>

<div id="pwdModal" class="modal">
  <div class="box">
    <h3 id="pwdTitle">🔒 需要密码</h3>
    <p id="pwdHint" style="font-size:12px;color:#888;margin:0 0 10px 0">改 .py 或系统文件需要认证</p>
    <input type="password" id="pwdInput" placeholder="编辑密码">
    <input type="password" id="pwdInput2" placeholder="再输一次" style="display:none">
    <div id="pwdMsg" style="margin-top:4px;font-size:13px;color:#c62828;min-height:18px"></div>
    <div class="bar" style="margin-top:8px">
      <button id="btnPwdOk" style="flex:1" onclick="doLogin()">登录</button>
      <button class="gray" style="flex:1" onclick="hidePwd()">取消</button>
    </div>
  </div>
</div>

<div id="newModal" class="modal">
  <div class="box">
    <h3>➕ 新建文本文件</h3>
    <label style="font-size:12px;color:#666">保存位置</label>
    <select id="newLocation" onchange="updateNewPath()">
      <option value="res">📁 内置 /res</option>
      <option value="sys">📁 内置 /sys</option>
      <option value="www">📁 内置 /www</option>
      <option value="ext">💾 外挂 /ext</option>
    </select>
    <label style="font-size:12px;color:#666">文件名</label>
    <input type="text" id="newName" placeholder="note（自动补 .txt）"
           oninput="updateNewPath()">
    <div id="newPreview" style="font-size:12px;color:#888;margin:4px 0 8px 0;"></div>
    <div class="bar" style="margin-top:8px">
      <button class="g" style="flex:1" onclick="doNew()">创建</button>
      <button class="gray" style="flex:1" onclick="hideNew()">取消</button>
    </div>
  </div>
</div>

<script>
(function(){
var TOK='badge_editor_token';
var currentPath=null;
var hasPwd=false, loggedIn=false;
var pendingAction=null;
var pwdMode='login';
// C3 上 microdot 的 MAX_BODY_SIZE = 65536，JSON 转义后 ~30% 开销，取 50000 安全线
var MAX_FILE_BYTES = 50000;

function getTok(){try{return localStorage.getItem(TOK)||''}catch(e){return ''}}
function setTok(t){try{if(t)localStorage.setItem(TOK,t);else localStorage.removeItem(TOK)}catch(e){}}

function authFetch(url,opt){
  opt=opt||{};opt.headers=opt.headers||{};
  var t=getTok();if(t)opt.headers['X-Auth-Token']=t;
  return fetch(url,opt);
}

async function refreshStatus(){
  try{
    var r=await authFetch('/editor/api/auth/status');
    var j=await r.json();
    hasPwd=!!j.has_password;
    loggedIn=!!j.logged_in;
    var s=document.getElementById('state');
    var btnSet=document.getElementById('btnSetPwd');
    var btnOut=document.getElementById('btnLogout');
    if(!hasPwd){
      s.className='state no';
      s.textContent='⚠️ 未设置密码。点"🔑 首次设置密码"设置后，才能编辑 .py 文件。';
      btnSet.style.display='inline-block';
      btnOut.style.display='none';
    }else if(loggedIn){
      s.className='state ok';
      s.textContent='🔓 已登录（可编辑 .py 和系统文件）';
      btnSet.style.display='none';
      btnOut.style.display='inline-block';
    }else{
      s.className='state';
      s.textContent='🔒 未登录（.txt/.html/.css/.js 免密；.py 需要密码）';
      btnSet.style.display='none';
      btnOut.style.display='none';
    }
  }catch(e){console.error(e)}
}

async function loadList(){
  var box=document.getElementById('tree');
  box.textContent='加载中...';
  try{
    var r=await fetch('/editor/api/file/list');
    var j=await r.json();
    if(!j.ok){box.textContent='加载失败: '+j.err;return}
    var dirs=j.dirs||{};
    box.innerHTML='';
    var order=['','res','sys','www','ext'];
    order.forEach(function(d){
      var items=dirs[d];
      if(!items||items.length===0)return;
      var b=document.createElement('b');
      if(d==='ext')b.textContent='💾 /ext (外挂)';
      else if(d==='')b.textContent='/ (根)';
      else b.textContent='/'+d;
      box.appendChild(b);
      items.forEach(function(it){
        if(it.size<0)return;
        if(it.name.endsWith('.bak'))return;
        var btn=document.createElement('button');
        var p=(d===''?it.name:d+'/'+it.name);
        var isPy=it.name.endsWith('.py');
        var isBlocked=(it.name==='boot.py');
        btn.textContent=it.name+(isBlocked?' 🚫':(isPy?' 🔒':''));
        if(isPy)btn.className='py';
        else if(d==='ext')btn.className='ext';
        if(isBlocked){
          btn.disabled=true;
          btn.title='boot.py 已禁用';
        }else{
          btn.onclick=function(){openFile(p)};
        }
        box.appendChild(btn);
      });
    });
  }catch(e){box.textContent='加载失败: '+e}
}

function showPwdLogin(cb){
  pwdMode='login';
  pendingAction=cb||null;
  document.getElementById('pwdTitle').textContent='🔒 需要密码';
  document.getElementById('pwdHint').textContent='改 .py 或系统文件需要认证';
  document.getElementById('pwdInput2').style.display='none';
  document.getElementById('btnPwdOk').textContent='登录';
  var m=document.getElementById('pwdModal');
  m.classList.add('on');
  document.getElementById('pwdInput').value='';
  document.getElementById('pwdInput2').value='';
  document.getElementById('pwdMsg').textContent='';
  setTimeout(function(){document.getElementById('pwdInput').focus()},100);
}

function showPwdSetup(cb){
  pwdMode='setup';
  pendingAction=cb||null;
  document.getElementById('pwdTitle').textContent='🔑 首次设置密码';
  document.getElementById('pwdHint').textContent='设置后，改 .py 和系统文件都需要此密码。忘记后连按 3 次 BOOT 键可清空。';
  document.getElementById('pwdInput2').style.display='block';
  document.getElementById('btnPwdOk').textContent='设置密码';
  var m=document.getElementById('pwdModal');
  m.classList.add('on');
  document.getElementById('pwdInput').value='';
  document.getElementById('pwdInput2').value='';
  document.getElementById('pwdMsg').textContent='';
  setTimeout(function(){document.getElementById('pwdInput').focus()},100);
}

function hidePwd(){
  document.getElementById('pwdModal').classList.remove('on');
  pendingAction=null;
}

async function doLogin(){
  var pwd=document.getElementById('pwdInput').value;
  var msg=document.getElementById('pwdMsg');

  if(pwdMode==='setup'){
    var pwd2=document.getElementById('pwdInput2').value;
    if(!pwd||pwd.length<4){msg.textContent='密码至少 4 位';msg.style.color='#c62828';return}
    if(pwd.length>32){msg.textContent='密码最多 32 位';msg.style.color='#c62828';return}
    if(pwd!==pwd2){msg.textContent='两次不一致';msg.style.color='#c62828';return}
    msg.textContent='设置中...';msg.style.color='#0070c0';
    try{
      var r=await fetch('/editor/api/auth/set_password',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({password:pwd})
      });
      var j=await r.json();
      if(j.ok){
        setTok(j.token||'');
        msg.textContent='';
        var cb=pendingAction;hidePwd();
        await refreshStatus();
        if(cb)cb();
      }else{
        msg.textContent=j.err||'设置失败';
        msg.style.color='#c62828';
      }
    }catch(e){msg.textContent='请求失败: '+e;msg.style.color='#c62828'}
    return;
  }

  if(!pwd){msg.textContent='请输入密码';return}
  msg.textContent='登录中...';msg.style.color='#0070c0';
  try{
    var r=await fetch('/editor/api/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:pwd})
    });
    var j=await r.json();
    if(j.ok){
      setTok(j.token||'');
      msg.textContent='';
      var cb=pendingAction;hidePwd();
      await refreshStatus();
      if(cb)cb();
    }else{msg.textContent=j.err||'密码错误';msg.style.color='#c62828'}
  }catch(e){msg.textContent='请求失败: '+e;msg.style.color='#c62828'}
}

async function openFile(path){
  var msg=document.getElementById('msg');
  msg.textContent='读取中...';msg.style.color='#0070c0';
  try{
    var r=await authFetch('/editor/api/file/read?path='+encodeURIComponent(path));
    var j=await r.json();
    if(j.code==='need_auth'){
      msg.textContent='🔒 需要密码';
      msg.style.color='#c62828';
      showPwdLogin(function(){openFile(path)});
      return;
    }
    if(j.code==='no_password'){
      msg.textContent='🔑 请先设置编辑密码';
      msg.style.color='#c62828';
      showPwdSetup(function(){openFile(path)});
      return;
    }
    if(!j.ok){msg.textContent='读取失败: '+j.err;msg.style.color='#c62828';return}
    currentPath=path;
    document.getElementById('currentPath').textContent=path;
    document.getElementById('editor').value=j.content;
    document.getElementById('editorBox').style.display='block';
    document.getElementById('btnSave').style.display='inline-block';
    document.getElementById('btnReboot').style.display='inline-block';
    var extra=(j.encoding && j.encoding!=='utf-8')?(' ('+j.encoding+')'):'';
    var warn=(j.size>MAX_FILE_BYTES)?' ⚠️ 超过 '+MAX_FILE_BYTES+' 字节无法保存':'';
    msg.textContent='大小: '+j.size+' 字节'+extra+warn;
    msg.style.color=(j.encoding && j.encoding!=='utf-8')?'#f9a825':(j.size>MAX_FILE_BYTES?'#c62828':'#888');
    try{
      var u=new URL(window.location.href);
      u.searchParams.set('path',path);
      window.history.replaceState(null,'',u.toString());
    }catch(e){}
  }catch(e){msg.textContent='读取失败: '+e;msg.style.color='#c62828'}
}

async function save(){
  if(!currentPath)return;
  var msg=document.getElementById('msg');
  var content=document.getElementById('editor').value;

  // C3 上 microdot 的 MAX_BODY_SIZE 为 64KB，加上 JSON 开销超过阈值会静默断开
  if(content.length > MAX_FILE_BYTES){
    msg.textContent='❌ 文件太大 ('+content.length+' 字节)，超过 '+MAX_FILE_BYTES+' 字节上限。请在 PC 上编辑后用「文件管理」上传。';
    msg.style.color='#c62828';
    return;
  }

  msg.textContent='保存中...';msg.style.color='#0070c0';
  try{
    var r=await authFetch('/editor/api/file/write',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({path:currentPath,content:content})
    });
    var j=await r.json();
    if(j.code==='need_auth'){
      msg.textContent='🔒 需要密码';
      msg.style.color='#c62828';
      showPwdLogin(function(){save()});
      return;
    }
    if(j.code==='no_password'){
      msg.textContent='🔑 请先设置编辑密码';
      msg.style.color='#c62828';
      showPwdSetup(function(){save()});
      return;
    }
    if(j.ok){
      if(j.pending_rollback){
        msg.textContent='✅ 已保存 ('+j.size+' 字节) — ⚠️ 需点"🔄 重启板子"验证';
        msg.style.color='#f9a825';
        if(confirm('已保存 .py 文件。\n\n需要重启才能验证，如果起不来会自动回滚。\n\n现在重启吗？')){
          doReboot();
        }
      }else{
        msg.textContent='✅ 已保存 ('+j.size+' 字节)';
        msg.style.color='#43a047';
      }
    }else{
      msg.textContent='❌ '+(j.err||'未知错误');
      msg.style.color='#c62828';
    }
  }catch(e){
    msg.textContent='❌ 保存失败: '+e+' （文件过大时 C3 会直接断开）';
    msg.style.color='#c62828';
  }
}

async function doReboot(){
  if(!confirm('重启板子？\n\nWiFi 会断开，10 秒后重连。\n如果是 .py 验证启动失败，会自动回滚。'))return;
  try{
    await fetch('/editor/api/reboot',{method:'POST'});
    document.body.innerHTML='<div style="padding:40px;text-align:center"><h2>🔄 正在重启...</h2><p style="color:#888">10 秒后请重新连接 WiFi</p></div>';
  }catch(e){alert('重启请求失败: '+e)}
}

function showNew(){
  document.getElementById('newModal').classList.add('on');
  document.getElementById('newName').value='';
  document.getElementById('newLocation').value='res';
  updateNewPath();
  setTimeout(function(){document.getElementById('newName').focus()},100);
}

function hideNew(){document.getElementById('newModal').classList.remove('on')}

function updateNewPath(){
  var loc=document.getElementById('newLocation').value;
  var name=document.getElementById('newName').value.trim();
  if(name && name.indexOf('.')<0)name=name+'.txt';
  var full=loc+'/'+(name||'...');
  var presets={
    'res':'/res 内置资源目录',
    'sys':'/sys 内置系统目录',
    'www':'/www 网页目录',
    'ext':'/ext 外挂 SPI flash'
  };
  document.getElementById('newPreview').textContent=
    '将创建: '+full+'  ('+(presets[loc]||'')+')';
}

async function doNew(){
  var loc=document.getElementById('newLocation').value;
  var name=document.getElementById('newName').value.trim();
  if(!name){alert('请输入文件名');return}
  var path=loc+'/'+name;
  if(name.indexOf('.')<0)path=loc+'/'+name+'.txt';
  try{
    var r=await fetch('/editor/api/file/new',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({path:path,content:''})
    });
    var j=await r.json();
    if(j.code==='need_auth'){
      showPwdLogin(function(){doNew()});
      return;
    }
    if(j.ok){
      hideNew();
      loadList();
      setTimeout(function(){openFile(j.path)},300);
    }else{
      alert('失败: '+(j.err||'未知错误'));
    }
  }catch(e){alert('请求失败: '+e)}
}

function logout(){
  if(!confirm('退出登录？'))return;
  setTok('');
  refreshStatus();
}

document.getElementById('pwdInput').addEventListener('keydown',function(e){
  if(e.key==='Enter')doLogin();
});
document.getElementById('newName').addEventListener('keydown',function(e){
  if(e.key==='Enter')doNew();
});

function getUrlPath(){
  try{
    var u=new URL(window.location.href);
    return u.searchParams.get('path')||'';
  }catch(e){return ''}
}

window.loadList = loadList;
window.showNew = showNew;
window.hideNew = hideNew;
window.updateNewPath = updateNewPath;
window.doNew = doNew;
window.save = save;
window.doReboot = doReboot;
window.showPwdSetup = showPwdSetup;
window.showPwdLogin = showPwdLogin;
window.hidePwd = hidePwd;
window.doLogin = doLogin;
window.logout = logout;

refreshStatus().then(function(){
  loadList();
  var p=getUrlPath();
  if(p){
    setTimeout(function(){openFile(p)},400);
  }
});
})();
</script>
</body>
</html>
