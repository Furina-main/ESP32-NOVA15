<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电子吧唧</title>
<script>
  document.write('<link rel="stylesheet" href="/www/main.css?v=' + Date.now() + '">');
</script>
<style>
  [x-cloak]{display:none!important}
</style>
<script src="/www/htmx.min.js" defer></script>
<script src="/www/alpine.min.js" defer></script>
</head>
<body x-data="badgeApp()" x-cloak>
  <!-- 🎯 强制背景层铺满并沉底 -->
  <div id="bg-layer" style="position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: -1 !important; pointer-events: none !important; background-size: cover !important; background-position: center !important;"></div>

  <h2>电子吧唧</h2>
  <div id="status">加载中...</div>

  <div class="card" id="configCard">
    <h3>⚙ 系统配置</h3>

    <div class="setting-row">
      <label>WiFi 名称：</label>
      <input type="text" id="apSsid" placeholder="ESP32-Badge" maxlength="32"
             style="flex:1 1 200px;">
      <button id="saveApSsid" class="btn-success">保存</button>
    </div>
    <div id="apSsidHint" style="font-size:12px;color:#888;margin-top:4px;">
      修改后下次进入服务器模式生效
    </div>

    <div style="border-top:1px solid rgba(0,0,0,0.1);margin:12px 0;"></div>

    <div class="setting-row">
      <label>深度睡眠：</label>
      <button id="dsToggle" data-value="OFF">加载中...</button>
    </div>
    <div id="dsHint" style="font-size:12px;color:#888;margin-top:4px;">
      切换后退出服务器生效
    </div>

    <div style="border-top:1px solid rgba(0,0,0,0.1);margin:12px 0;"></div>

    <div class="setting-row">
      <label>间隔(秒)：</label>
      <input type="number" id="interval" value="3600" min="60" style="width:100px">
      <label>模式：</label>
      <select id="mode">
        <option value="fixed">顺序</option>
        <option value="random">随机</option>
        <option value="single">单图固定</option>
      </select>
      <button id="savePlaylistCfg" class="btn-success">保存</button>
    </div>
    <div id="playlistHint" style="font-size:12px;color:#888;margin-top:4px;">
      保存后立即生效；间隔 ≥ 60 秒
    </div>
  </div>

  <div class="card" id="galleryCard">
    <h3>📷 图库</h3>
    <div id="galleryContent">加载中...</div>
  </div>

  <div>
    <button :class="{ active: panel === 'list' }" @click="togglePanel('list')">🎬 播放列表</button>
    <button :class="{ active: panel === 'fm' }" @click="togglePanel('fm')">📁 文件管理</button>
    <button :class="{ active: panel === 'appearance' }" @click="togglePanel('appearance')">🎨 网页外观</button>
    <button onclick="window.open('/editor','_blank')" class="btn-success">📝 在线编辑</button>
  </div>

  <div class="card" id="panel">
    <div x-show="!panel" class="placeholder">（选上面一个功能）</div>

    <div x-show="panel === 'fm'">
      <div hx-get="/www/fm.html" hx-trigger="load" hx-swap="innerHTML">
        <div class="placeholder">加载中...</div>
      </div>
    </div>

    <div x-show="panel === 'list'">
      <div hx-get="/www/list.html" hx-trigger="load" hx-swap="innerHTML">
        <div class="placeholder">加载中...</div>
      </div>
    </div>

    <div x-show="panel === 'appearance'">
      <div hx-get="/www/appearance.html" hx-trigger="load" hx-swap="innerHTML">
        <div class="placeholder">加载中...</div>
      </div>
    </div>
  </div>

  <!-- 🎯 究极大图弹窗：移除 !important，用内层 div 接管 Flex 布局 -->
  <div x-show="modal.open" x-cloak 
       style="position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; background: rgba(0,0,0,0.8) !important; z-index: 999999 !important;"
       @click.self="closeModal()">
    
    <div style="display: flex; width: 100%; height: 100%; align-items: center; justify-content: center;">
      <div style="background: #fff; border-radius: 12px; padding: 16px; max-width: 95vw; max-height: 95vh; display: flex; flex-direction: column; align-items: center; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        
        <canvas id="modalCanvas" style="max-width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px;"></canvas>
        
        <div style="margin-top:16px; display:flex; justify-content:center; gap:16px;">
          <button class="btn-danger" @click="displayNow()" :disabled="modal.busy" x-text="modal.btnText" style="padding: 10px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; background: #ff3b30; color: #fff;">⚡ 立刻上屏</button>
          <button class="btn-success" @click="downloadPng()" style="padding: 10px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; background: #34c759; color: #fff;">⬇️ 下载 PNG</button>
        </div>
        
        <!-- 绝对定位的红叉关闭按钮 -->
        <button @click="closeModal()" style="position: absolute; top: -12px; right: -12px; width: 34px; height: 34px; border-radius: 50%; background: #ff3b30; color: #fff; border: 2px solid #fff; font-size: 20px; line-height: 30px; text-align: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.4); font-weight: bold;">×</button>
      </div>
    </div>
  </div>

  <script>
    document.write('<script src="/www/main.js?v=' + Date.now() + '"><\/script>');
  </script>

  <script>
  function badgeApp() {
    return {
      panel: null,
      modal: { open: false, path: null, busy: false, btnText: '⚡ 立刻上屏' },

      init() {
        window.__showBigImage = (p) => this.openModal(p);
      },

      togglePanel(name) {
        this.panel = (this.panel === name) ? null : name;
      },

      openModal(path) {
        var self = this;
        this.modal.path = path;
        window.__decodeBitmap(path, 768).then(function (big) {
          var c = document.getElementById('modalCanvas');
          c.width = big.width;
          c.height = big.height;
          c.getContext('2d').drawImage(big, 0, 0);
          self.modal.open = true;
        }).catch(function (e) {
          alert('加载大图失败: ' + e);
        });
      },

      closeModal() {
        this.modal.open = false;
        this.modal.path = null;
      },

      async displayNow() {
        if (!this.modal.path || this.modal.busy) return;
        this.modal.busy = true;
        this.modal.btnText = '正在刷新(约需30秒)...';
        try {
          var r = await fetch('/api/epaper/display_now', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: this.modal.path })
          });
          var j = await r.json();
          if (j.ok) {
            this.modal.btnText = '✅ 成功';
            setTimeout(() => {
              this.modal.btnText = '⚡ 立刻上屏';
              this.modal.busy = false;
            }, 2000);
          } else {
            alert('刷新失败: ' + (j.err || '未知错误'));
            this.modal.btnText = '⚡ 立刻上屏';
            this.modal.busy = false;
          }
        } catch (e) {
          alert('请求失败: ' + e);
          this.modal.btnText = '⚡ 立刻上屏';
          this.modal.busy = false;
        }
      },

      downloadPng() {
        if (this.modal.path && window.__downloadAsPng) {
          window.__downloadAsPng(this.modal.path);
        }
      }
    };
  }
  </script>
</body>
</html>
